name: Lock

on:
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:

permissions:
  issues: write
  pull-requests: write

jobs:
  lock:
    name: 🔒 Lock closed issues and PRs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: dessant/lock-threads@89ae32b08ed1a541efecbab17912962a5e38981c # v6
        with:
          issue-inactive-days: "7"
          issue-lock-reason: ""
          pr-inactive-days: "7"
          pr-lock-reason: ""
