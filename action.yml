name: "Workflow Runs Cleanup (Novusvetus)"
author: "Novusvetus / Marcel Rudolf <development@novusvetus.de> (original concept by dmvict)"
branding:
  icon: "scissors"
  color: "white"
description: "Delete old GitHub Actions workflow runs by age, branch, conclusion, and closed PR status."
inputs:
  token:
    description: "GitHub token for workflow-runs cleanup API calls."
    required: false
    default: ${{ github.token }}
  repo:
    description: "Target repository in {owner}/{repo} format."
    required: false
    default: ${{ github.repository }}
  workflow_id:
    description: "Workflow filename or numeric workflow ID to scope cleanup."
    required: false
  branch:
    description: "Branch name to clean runs for. Defaults to all branches."
    required: false
  run_conclusions:
    description: "Run conclusion filters (e.g. success, failure, cancelled, skipped)."
    required: false
  save_period:
    description: "Retention window to keep runs. Number = days, or hh:mm:ss."
    required: false
    default: 90
  save_min_runs_number:
    description: "Minimum number of matching completed runs to keep."
    required: false
    default: 10
  dry:
    description: "Dry-run mode: prints runs that would be deleted."
    required: false
    default: false
  only_closed_pull_requests:
    description: "When true, delete only runs from branches that have at least one closed PR."
    required: false
    default: false
runs:
  using: node24
  main: "dist/main.mjs"
